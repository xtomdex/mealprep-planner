name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code style, static analysis, architecture, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same major version as compose.yaml, so a migration that works
    # locally works here. Real environment variables win over .env files,
    # so this URL replaces the local one (port 5434) for every step.
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v3

      # Cheapest checks first: a style error fails the build in seconds.
      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: |
          php bin/console cache:warmup --env=dev --quiet
          vendor/bin/phpstan analyse --no-progress

      - name: Architecture rules
        run: vendor/bin/deptrac analyse --no-progress

      # The test database is built by the migrations, not by schema:create:
      # the pipeline then proves that the migrations produce the schema the
      # mapping describes, which is what production will run.
      - name: Test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test

      - name: Schema in sync with the mapping
        run: php bin/console doctrine:schema:validate --env=test

      - name: Tests
        run: vendor/bin/phpunit
