# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Handlers register by implementing a marker interface, so Application
    # classes need no Symfony attribute. Messenger reads the handled message
    # class from the type of __invoke()'s argument.
    _instanceof: &handler_registration
        App\Shared\Application\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Application\Bus\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # The domain asks for ids through its own port; this is the one place that
    # names the implementation behind it.
    App\Shared\Domain\Identity\IdGenerator: '@App\Shared\Infrastructure\Identity\SymfonyUuidGenerator'

    # Application code depends on the bus ports; Messenger stays behind them.
    App\Shared\Application\Bus\CommandBus: '@App\Shared\Infrastructure\Bus\MessengerCommandBus'
    App\Shared\Application\Bus\QueryBus: '@App\Shared\Infrastructure\Bus\MessengerQueryBus'

    # Ports whose production implementation arrives with the database (D-07).
    # Synthetic: the container knows the id, so handlers that depend on it
    # compile, but nothing provides it, so using one outside the test
    # environment fails loudly instead of running against a stand-in.
    # Each line is replaced by the Doctrine implementation in D-07.
    App\Catalog\Domain\Repository\ProductRepository: { synthetic: true }
    App\Shared\Application\TransactionalRunner: { synthetic: true }

# Test-only messages and handlers for the bus integration test.
# _defaults and _instanceof apply only to the section that declares them, so
# this block needs its own; the YAML anchor reuses the production rules
# verbatim instead of a copy, which is why the block lives in this file and
# not in a separate services_test.yaml (anchors do not cross files). The test
# therefore proves the same registration path that real handlers take.
when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        _instanceof: *handler_registration
        App\Tests\Support\Shared\Bus\:
            resource: '../tests/Support/Shared/Bus/'
        # Nothing in src/ uses the ports yet, so the compiler would remove
        # them; public in the test environment only, for the kernel tests.
        App\Shared\Application\Bus\CommandBus:
            alias: App\Shared\Infrastructure\Bus\MessengerCommandBus
            public: true
        App\Shared\Application\Bus\QueryBus:
            alias: App\Shared\Infrastructure\Bus\MessengerQueryBus
            public: true
        # Until D-07 the in-memory fakes stand behind the ports, in this
        # environment only: kernel tests then exercise the real handlers and
        # the bus, and need no database.
        App\Tests\Support\Catalog\:
            resource: '../tests/Support/Catalog/'
        App\Tests\Support\Shared\ImmediateTransactionalRunner: ~
        App\Catalog\Domain\Repository\ProductRepository:
            alias: App\Tests\Support\Catalog\InMemoryProductRepository
            public: true
        App\Shared\Application\TransactionalRunner:
            alias: App\Tests\Support\Shared\ImmediateTransactionalRunner
            public: true
