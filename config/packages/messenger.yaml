# Two synchronous buses behind the Application ports CommandBus and QueryBus.
# No transports: nothing is sent asynchronously yet, so every message is
# handled in the request that dispatched it, and its exceptions reach the
# caller. Handlers are tagged with their bus in services.yaml (_instanceof).
framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus: ~
            query.bus: ~
