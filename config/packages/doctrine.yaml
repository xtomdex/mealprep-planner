doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        server_version: '17'

        # Introspected timestamptz columns are read as the microsecond type,
        # so schema:validate and migrations:diff compare like with like.
        mapping_types:
            timestamptz: datetimetz_micro_immutable

        profiling_collect_backtrace: '%kernel.debug%'

        # Typed ids in native uuid columns, one type per id class (UuidType);
        # amounts and moments with the precision the domain needs.
        types:
            decimal_amount: App\Shared\Infrastructure\Persistence\Type\DecimalAmountType
            datetimetz_micro_immutable: App\Shared\Infrastructure\Persistence\Type\DateTimeTzMicroImmutableType
            product_id: App\Shared\Infrastructure\Persistence\Type\ProductIdType
            component_id: App\Shared\Infrastructure\Persistence\Type\ComponentIdType
            dish_id: App\Shared\Infrastructure\Persistence\Type\DishIdType
            meal_plan_id: App\Planning\Infrastructure\Persistence\Type\MealPlanIdType
            meal_plan_entry_id: App\Planning\Infrastructure\Persistence\Type\MealPlanEntryIdType
            shopping_list_id: App\Planning\Infrastructure\Persistence\Type\ShoppingListIdType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        # XML instead of attributes: the domain stays free of the ORM, and the
        # whole mapping of a class is read in one file, next to its module's.
        mappings:
            Catalog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/Catalog'
                prefix: App\Catalog\Domain\Model
            Planning:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/Planning'
                prefix: App\Planning\Domain\Model
            # Value objects of the shared kernel, embedded by both modules.
            Shared:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/Shared'
                prefix: App\Shared\Domain\Measurement

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
