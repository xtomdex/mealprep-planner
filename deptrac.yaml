# Architecture rules, checked by `make deptrac` and in CI.
#
# - Domain depends only on the shared kernel (Shared/Domain), PSR interfaces and
#   Doctrine Collections (see the DoctrineCollections layer below).
# - Application depends on its own Domain and the shared kernel; it never imports
#   Symfony or Doctrine (handlers are wired in services.yaml).
# - Infrastructure may use everything, including the framework.
# - Modules talk to each other only from Infrastructure to another module's
#   Application layer (an adapter calling a public use case or query).
# - Reporting has no domain: it reads the database schema directly.
deptrac:
  paths:
    - ./src
  layers:
    - name: SharedDomain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
    - name: SharedApplication
      collectors:
        - type: directory
          value: src/Shared/Application/.*
    - name: SharedInfrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*
    - name: CatalogDomain
      collectors:
        - type: directory
          value: src/Catalog/Domain/.*
    - name: CatalogApplication
      collectors:
        - type: directory
          value: src/Catalog/Application/.*
    - name: CatalogInfrastructure
      collectors:
        - type: directory
          value: src/Catalog/Infrastructure/.*
    - name: PlanningDomain
      collectors:
        - type: directory
          value: src/Planning/Domain/.*
    - name: PlanningApplication
      collectors:
        - type: directory
          value: src/Planning/Application/.*
    - name: PlanningInfrastructure
      collectors:
        - type: directory
          value: src/Planning/Infrastructure/.*
    - name: ReportingApplication
      collectors:
        - type: directory
          value: src/Reporting/Application/.*
    - name: ReportingInfrastructure
      collectors:
        - type: directory
          value: src/Reporting/Infrastructure/.*
    # Doctrine Collections gets its own layer instead of a blanket Doctrine
    # exception: it is a plain data-structure library with no ORM or database
    # dependency, and aggregates keep their child lines in a Collection so
    # that the ORM can hydrate them later. A separate layer keeps that one
    # namespace visible in every ruleset that allows it, while the rest of
    # Doctrine (ORM, DBAL, Persistence) stays in Framework and out of Domain.
    - name: DoctrineCollections
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\Common\\Collections\\#'
    # The negative lookahead removes Doctrine\Common\Collections from here, so a
    # class belongs to exactly one of the two layers.
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Symfony\\|Doctrine\\(?!Common\\Collections\\))#'
    - name: Psr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\#'
  ruleset:
    SharedDomain:
      - DoctrineCollections
      - Psr
    SharedApplication:
      - SharedDomain
      - Psr
    SharedInfrastructure:
      - SharedDomain
      - SharedApplication
      - Framework
      - DoctrineCollections
      - Psr
    CatalogDomain:
      - SharedDomain
      - DoctrineCollections
      - Psr
    CatalogApplication:
      - CatalogDomain
      - SharedDomain
      - SharedApplication
      - Psr
    CatalogInfrastructure:
      - CatalogDomain
      - CatalogApplication
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - PlanningApplication
      - ReportingApplication
      - Framework
      - DoctrineCollections
      - Psr
    PlanningDomain:
      - SharedDomain
      - DoctrineCollections
      - Psr
    PlanningApplication:
      - PlanningDomain
      - SharedDomain
      - SharedApplication
      - Psr
    PlanningInfrastructure:
      - PlanningDomain
      - PlanningApplication
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - CatalogApplication
      - ReportingApplication
      - Framework
      - DoctrineCollections
      - Psr
    ReportingApplication:
      - SharedApplication
      - Psr
    ReportingInfrastructure:
      - ReportingApplication
      - SharedDomain
      - SharedApplication
      - SharedInfrastructure
      - CatalogApplication
      - PlanningApplication
      - Framework
      - DoctrineCollections
      - Psr
